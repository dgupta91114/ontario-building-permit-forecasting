project:
  title: "Forecasting Ontario Residential Building-Permit Values Using Explainable Time-Series and Machine-Learning Models"
  start_date: "2018-01-01"
  end_date: "2026-05-01"
  random_seed: 640
  selected_cmas:
    Toronto:
      patterns: ["toronto"]
    Hamilton:
      patterns: ["hamilton"]
    Kitchener-Cambridge-Waterloo:
      patterns: ["kitchener", "cambridge", "waterloo"]
    London:
      patterns: ["london"]
    Windsor:
      patterns: ["windsor"]

sources:
  statcan_building_permits:
    product_id: "34100292"
    table_number: "34-10-0292-01"
    landing_page: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=3410029201"
    wds_endpoint: "https://www150.statcan.gc.ca/t1/wds/rest/getFullTableDownloadCSV/{product_id}/en"
  statcan_unemployment:
    product_id: "14100287"
    table_number: "14-10-0287-01"
    landing_page: "https://www150.statcan.gc.ca/t1/tbl1/en/tv.action?pid=1410028701"
    wds_endpoint: "https://www150.statcan.gc.ca/t1/wds/rest/getFullTableDownloadCSV/{product_id}/en"
  bank_of_canada:
    series: "V39079"
    label: "Target for the overnight rate"
    endpoint: "https://www.bankofcanada.ca/valet/observations/{series}/json"

filters:
  building_permits:
    seasonal_adjustment:
      exact_candidates:
        - "Seasonally adjusted"
      required_tokens: ["seasonally", "adjusted"]
      forbidden_tokens: ["unadjusted"]
    value_type:
      exact_candidates:
        - "Current dollars"
      required_tokens: ["current", "dollar"]
      forbidden_tokens: ["constant"]
    type_of_structure:
      exact_candidates:
        - "Residential structures, total"
        - "Total residential"
        - "Residential, total"
      required_tokens: ["residential", "total"]
      forbidden_tokens: ["non-residential"]
    type_of_work:
      exact_candidates:
        - "Types of work, total"
        - "Type of work, total"
        - "Total, type of work"
        - "All types of work"
      required_tokens: ["total"]
      forbidden_tokens: []
  unemployment:
    geography_exact_candidates: ["Ontario"]
    labour_force_characteristic_exact_candidates: ["Unemployment rate"]
    data_type_exact_candidates: ["Seasonally adjusted"]
    gender_exact_candidates: ["Total, gender", "Both sexes", "Total - Gender"]
    age_group_exact_candidates: ["15 years and over"]

features:
  forecast_horizon_months: 1
  lags: [1, 3, 6, 12]
  rolling_windows: [3]
  pandemic_start: "2020-03-01"
  pandemic_end: "2021-06-01"
  primary_numeric_features:
    - permit_value_t
    - lag_1
    - lag_3
    - lag_6
    - lag_12
    - rolling_mean_3
    - rolling_sd_3
    - month_sin
    - month_cos
    - time_index
    - pandemic_indicator
  macro_features:
    - overnight_rate_lag_1
    - unemployment_lag_1
  categorical_features:
    - cma

validation:
  holdout_months: 12
  initial_train_months: 36
  cv_test_months: 12
  cv_step_months: 12
  alpha: 0.05
  conformal_alpha: 0.10
  practical_mae_improvement_pct: 5.0
  regional_degradation_tolerance_pct: 10.0

models:
  elastic_net:
    alpha: [0.1, 1.0]
    l1_ratio: [0.5, 1.0]
  random_forest:
    n_estimators: [150]
    max_depth: [3, null]
    min_samples_leaf: [2, 4]
    max_features: [0.7]
  xgboost:
    n_estimators: [100, 200]
    max_depth: [2, 3]
    learning_rate: [0.05]
    subsample: [0.8]
    colsample_bytree: [0.8]
